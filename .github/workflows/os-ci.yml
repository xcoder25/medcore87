name: OS CI

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/os/**'
      - 'packages/**'
      - '.github/workflows/os-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'apps/os/**'
      - 'packages/**'
      - '.github/workflows/os-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        working-directory: .
        run: npm ci || npm install
      - name: Typecheck / production build
        working-directory: apps/os
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build
